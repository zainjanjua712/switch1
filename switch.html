<!DOCTYPE html>
<html>
<head>
  <title>Light Control</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
  <button id="connectBtn">Connect</button>
  <button id="onBtn" disabled>Turn ON</button>
  <button id="offBtn" disabled>Turn OFF</button>
  <p id="status">Disconnected</p>

  <script>
    let client;
    const broker = "test.mosquitto.org";
    const port = 1883;
    
    document.getElementById('connectBtn').onclick = function() {
      client = new Paho.MQTT.Client(broker, port, "web_client_" + Math.random());
      
      client.connect({
        onSuccess: function() {
          document.getElementById('status').textContent = 'Connected';
          document.getElementById('onBtn').disabled = false;
          document.getElementById('offBtn').disabled = false;
          client.subscribe("house/livingroom/light/status");
        }
      });
      
      client.onMessageArrived = function(message) {
        document.getElementById('status').textContent = 'Light is ' + message.payloadString;
      };
    };
    
    document.getElementById('onBtn').onclick = function() {
      client.send("house/livingroom/light", "ON");
    };
    
    document.getElementById('offBtn').onclick = function() {
      client.send("house/livingroom/light", "OFF");
    };
  </script>
</body>
</html>
