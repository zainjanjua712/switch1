<!DOCTYPE html>
<html>
<head>
    <title>LED Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
    <h1>💡 LED Test (GPIO0)</h1>
    <button onclick="sendCommand('ON')">Turn LED ON</button>
    <button onclick="sendCommand('OFF')">Turn LED OFF</button>
    <pre id="log"></pre>

    <script>
        let client;
        const log = msg => document.getElementById('log').textContent += msg + '\n';
        
        // Connect to MQTT
        client = new Paho.MQTT.Client('broker.emqx.io', 8084, 'web_' + Math.random());
        client.connect({
            useSSL: true,
            onSuccess: () => {
                log('✅ Connected to MQTT');
                client.subscribe('house/livingroom/light/status');
            },
            onFailure: err => log('❌ Failed: ' + err.errorMessage)
        });
        
        client.onMessageArrived = msg => {
            log('📨 Status: ' + msg.payloadString);
        };
        
        function sendCommand(cmd) {
            if (client && client.isConnected()) {
                const msg = new Paho.MQTT.Message(cmd);
                msg.destinationName = 'house/livingroom/light';
                client.send(msg);
                log('📤 Sent: ' + cmd);
            } else {
                log('⚠️ Not connected!');
            }
        }
    </script>
</body>
</html>
